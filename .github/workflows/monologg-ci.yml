name: Monologg CI

on:
  push:
    branches: [main]
    paths:
      - "monologg/**"
      - ".github/workflows/monologg-ci.yml"
  pull_request:
    paths:
      - "monologg/**"
      - ".github/workflows/monologg-ci.yml"

defaults:
  run:
    working-directory: monologg

jobs:
  ci:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: monologg/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: monologg/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
