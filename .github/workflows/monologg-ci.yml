name: Monologg CI

on:
  push:
    branches: [main]
    paths:
      - "monologg/**"
      - ".github/workflows/monologg-ci.yml"
  pull_request:
    paths:
      - "monologg/**"
      - ".github/workflows/monologg-ci.yml"

defaults:
  run:
    working-directory: monologg

jobs:
  ci:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: monologg/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: monologg/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Audit (fails on any high/critical not in the reviewed allowlist)
        # The allowlist lives in package.json's pnpm.auditConfig.ignoreGhsas —
        # two reviewed entries: GHSA-qwww-vcr4-c8h2 (react-router RSC-mode CSRF;
        # this app has no RSC/unstable_middleware usage anywhere, confirmed by
        # repo-wide grep) and GHSA-mh99-v99m-4gvg (a brace-expansion DoS reachable
        # only via eslint's/vitest's own dev-tooling dependency trees — see
        # apps/api/README.md's Phase 12 section for why a version-pin fix was
        # tried and reverted after it broke ESLint). A NEW high/critical
        # anywhere else still fails the build.
        run: pnpm run audit

      - name: Build
        run: pnpm run build

  docker:
    name: docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: monologg
          file: monologg/apps/api/Dockerfile
          push: false

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: monologg
          file: monologg/apps/web/Dockerfile
          push: false
          build-args: |
            VITE_API_MODE=live
