# SPA fallback — mirrors vercel.json's rewrite rule ("/(.*)" -> "/index.html")
# for the docker-compose/self-hosted deploy target (features.md Phase 12).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # apps/web's api-client.ts fetches same-origin relative paths
    # ("/api/v1/..." — see src/lib/api-client.ts), never an absolute URL, so
    # the docker-compose target reverse-proxies here rather than rebuilding
    # the bundle with a baked-in API host. "api" resolves via Docker's
    # internal DNS to the api service in docker-compose.yml.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        # Vite fingerprints these filenames on every build — safe to cache hard.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
